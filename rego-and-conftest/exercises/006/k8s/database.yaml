apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          readinessProbe:
            exec:
              command: ["pg_isready"]
          resources:
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  type: ClusterIP
  ports:
    - port: 5432
