apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web
          image: nginx:1.27
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            limits:
              memory: 256Mi
        - name: log-shipper
          image: fluent/fluent-bit:latest
        - name: metrics
          image: prom/statsd-exporter:latest
